[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vut-dongle"
version = "0.1.0"
description = "Packet builders and parsers for the VIVE Ultimate Tracker dongle (pairing, slot status, battery); no I/O"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["vut_dongle*"]
