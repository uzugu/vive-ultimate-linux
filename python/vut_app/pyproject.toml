[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vut-app"
version = "0.1.0"
description = "Single `vut` entry point for the VIVE Ultimate Tracker tools (daemon, rooms, calibration, diagnostics)"
requires-python = ">=3.10"
dependencies = []  # install pose_daemon, vut_roomstore and vut_mapbuild alongside (not on PyPI)

[project.scripts]
vut = "vut_app.cli:main"

[tool.setuptools.packages.find]
include = ["vut_app*"]
