[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "htc-pipe-codec"
version = "0.1.0"
description = "Codec for the HTC ViveTrackerServer named-pipe framing (research aid and test double)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
