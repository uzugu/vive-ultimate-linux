name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install daemon
        run: pip install -e python/pose_daemon
      - name: Unit tests
        run: python -m unittest discover -s python/pose_daemon/tests -v
      - name: Tool and research-helper tests
        run: |
          pip install pytest
          PYTHONPATH=python/vut_settings:python/htc_pipe_codec/src:python/vut_dongle:python/vut_roomstore:python/vut_app:python/pose_daemon/src \
            python -m pytest -q tests python/vut_settings/tests python/htc_pipe_codec/tests python/vut_dongle/tests python/vut_roomstore/tests python/vut_app/tests

  driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install daemon
        run: pip install -e python/pose_daemon
      - name: Build and run OpenVR-free tests
        run: |
          cmake -S steamvr_driver -B build/tests -DUTS_BUILD_DRIVER=OFF -DUTS_BUILD_TESTS=ON
          cmake --build build/tests
          ctest --test-dir build/tests --output-on-failure
      - name: Cross-language check (Python daemon -> C++ client)
        run: |
          ultimate-linux-support-daemon --source mock --socket-path /tmp/uts-ci.sock &
          daemon=$!
          for i in $(seq 50); do [ -S /tmp/uts-ci.sock ] && break; sleep 0.1; done
          UTS_E2E_SOCKET=/tmp/uts-ci.sock build/tests/ipc_pose_client_test
          kill $daemon
      - name: Build the SteamVR driver against the OpenVR SDK
        run: |
          git clone --depth 1 --branch v2.15.6 https://github.com/ValveSoftware/openvr "$RUNNER_TEMP/openvr"
          cmake -S steamvr_driver -B build/driver -DOPENVR_SDK_PATH="$RUNNER_TEMP/openvr"
          cmake --build build/driver
          test -f build/driver/stage/ultimate_tracker_linux/bin/linux64/driver_ultimate_tracker_linux.so

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install daemon
        run: pip install -e python/pose_daemon
      - name: Python unit tests (loopback TCP transport)
        run: python -m unittest discover -s python/pose_daemon/tests -v
      - name: Build and run OpenVR-free tests
        run: |
          cmake -S steamvr_driver -B build/tests -DUTS_BUILD_DRIVER=OFF -DUTS_BUILD_TESTS=ON
          cmake --build build/tests --config Release
          ctest --test-dir build/tests -C Release --output-on-failure
      - name: Cross-language check (Python daemon -> C++ client over TCP)
        run: |
          ultimate-linux-support-daemon --source mock --socket-path tcp:127.0.0.1:38450 &
          daemon=$!
          sleep 3
          UTS_E2E_SOCKET=tcp:127.0.0.1:38450 build/tests/Release/ipc_pose_client_test.exe
          kill $daemon
      - name: Build the SteamVR driver against the OpenVR SDK
        run: |
          git clone --depth 1 --branch v2.15.6 https://github.com/ValveSoftware/openvr "$RUNNER_TEMP/openvr"
          cmake -S steamvr_driver -B build/driver -DOPENVR_SDK_PATH="$RUNNER_TEMP/openvr"
          cmake --build build/driver --config Release
          test -f build/driver/stage/ultimate_tracker_linux/bin/win64/driver_ultimate_tracker_linux.dll

  package:
    needs: [python]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-x86_64}
          - {os: ubuntu-24.04-arm, name: linux-arm64}
          - {os: windows-latest, name: windows-x86_64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pyinstaller -e python/pose_daemon -e python/vut_roomstore -e python/vut_app
      - name: Build single-file executable
        run: packaging/build.sh
      - name: Smoke test
        run: |
          exe=dist/vut; [ -f dist/vut.exe ] && exe=dist/vut.exe
          "$exe" version
          "$exe" --help
          "$exe" room --root "$RUNNER_TEMP/rooms" list
          "$exe" daemon --help
      - uses: actions/upload-artifact@v4
        with:
          name: vut-${{ matrix.name }}
          path: dist/vut*
